services:
  web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    env_file:
      - /run/base44/app.env
    environment:
      - DJANGO_DEBUG=true
      - DJANGO_ALLOWED_HOSTS=*
      - PORT=3000
      - DJANGO_CSRF_TRUSTED_ORIGINS=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
    command:
      - sh
      - -ec
      - pip install --no-cache-dir -r requirements-dev.txt && python manage.py migrate --noinput && python manage.py seed_school_data && exec python manage.py runserver 0.0.0.0:3000
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:3000/healthz').read()"
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 3
